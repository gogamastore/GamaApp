org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
gradle.user.home=/home/user/.gradle
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Project (D:) dan pub cache (C:) berada di drive berbeda. Kotlin incremental
# compiler gagal membuat path relatif lintas-drive di Windows
# ("different roots" → Daemon compilation failed, mis. saat compile
# package_info_plus / image_picker_android). Matikan incremental.
kotlin.incremental=false
